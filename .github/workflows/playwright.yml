name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  # E2E test environment variables (must match .env.e2e)
  APP_ENV: testing
  APP_DEBUG: true
  APP_URL: http://127.0.0.1:8000
  DB_CONNECTION: sqlite
  DB_DATABASE: database/database.sqlite
  SESSION_DRIVER: file
  SESSION_DOMAIN: 127.0.0.1
  SESSION_SECURE_COOKIE: false
  CACHE_STORE: file

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, sqlite3

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist

      - name: Prepare Laravel environment
        run: |
          # Create storage directories with proper permissions
          mkdir -p storage/framework/{sessions,views,cache}
          mkdir -p storage/logs
          mkdir -p database
          chmod -R 775 storage bootstrap/cache

          # Use dedicated e2e environment file
          cp .env.e2e .env

          # Generate app key if needed
          php artisan key:generate --force || true

      - name: Prepare SQLite database
        run: |
          # Create fresh SQLite database
          rm -f database/database.sqlite
          touch database/database.sqlite

          # Run migrations and seed
          php artisan migrate:fresh --seed --force

          # Verify database has required users
          php artisan tinker --execute="echo 'Admin: ' . (App\Models\User::where('email', 'test@mailinator.com')->exists() ? 'OK' : 'MISSING');"

      - name: Install Node dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Run Playwright tests
        run: npx playwright test --project=chromium-admin --project=firefox-admin

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
